name: Manual — Pre-Release Staging

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Version tag override — leave blank to infer from open release-please PR
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  pull-requests: read

jobs:
  stage:
    uses: ScottKirvan/.github/.github/workflows/reusable-pre-release-staging.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
      project_name: ${{ github.event.repository.name }}
      project_context: "This is the website of the AI Extreme Programming organization (aixp.scottkirvan.com), the home of aiXP: Extreme Programming for human-AI teams of 1 to N. Releases change the landing page and its links. Write for visitors to the site, plainly and with no hype words."
      header: |
        ## AI Extreme Programming site

        > Extreme Programming for Human-AI Teams of 1 to N.

        ---
      footer: |
        ---
        🌐 [aixp.scottkirvan.com](https://aixp.scottkirvan.com/) ·💬 [Discord](https://discord.gg/TN6XJSNK5Y) · 🐛 [Report a Bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.md) · ✨ [Request Feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.md)
      changelog_path: "notes/CHANGELOG.md"
    # Passed by name: `secrets: inherit` doesn't reach workflows owned by another org (ScottKirvan)
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
